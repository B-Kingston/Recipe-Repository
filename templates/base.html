<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f2">
  <title>{% block title %}Kindle Recipes{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="utility-bar">
    <a class="brand" href="/" aria-label="Kindle Recipes home"><span class="brand-mark" aria-hidden="true">♨</span><span>Kindle Recipes</span></a>
    <nav class="top-nav" aria-label="Main navigation">
      <a href="/">Library</a>
      <a href="/recipes/new">New Recipe</a>
    </nav>
  <details class="utility-dropdown">
    <summary class="utility-action" aria-label="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="visually-hidden">Settings</span>
    </summary>
    <ul class="utility-menu">
      <li><a href="/settings/authorise-codex" class="utility-menu-item">Authorise Codex</a></li>
    </ul>
  </details>
  </header>
  <main class="app-shell">
    <div class="paper">
      {% block content %}{% endblock %}
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
