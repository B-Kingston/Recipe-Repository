<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f2">
  <title>{% block title %}Kindle Recipes{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="utility-bar">
    <a class="brand" href="/" aria-label="Recipe Repository home"><span class="brand-mark" aria-hidden="true">♨</span><span class="brand-text">Recipe Repository</span></a>
    <nav class="top-nav" aria-label="Main navigation">
      <a href="/">Library</a>
      <a href="/recipes/new">New Recipe</a>
    </nav>
  <details class="utility-dropdown">
    <summary class="utility-action" aria-label="Settings">
      <img class="settings-icon" src="/static/cog-round.svg" alt="" aria-hidden="true">
      <span class="visually-hidden">Settings</span>
    </summary>
    <ul class="utility-menu">
      <li><a href="/settings/authorise-codex" class="utility-menu-item">Authorise Codex</a></li>
    </ul>
  </details>
  </header>
  <main class="app-shell">
    <div class="paper">
      {% block content %}{% endblock %}
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
