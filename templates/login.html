<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Sign in · Recipe Repository</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/display.css">
</head>
<body class="setup-page">
  <main class="app-shell">
    <div class="paper setup-card">
      <div class="form-intro">
        <p class="eyebrow">Recipe Repository</p>
        <h1>Sign in</h1>
        <p class="deck">Enter the username and password you chose at setup.</p>
      </div>
      <div class="compact-panel">
        <form method="post" action="/login">
          <input type="hidden" name="next" value="{{ next }}">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          {% if !error.is_empty() %}<p class="error" role="alert">{{ error }}</p>{% endif %}
          <p class="actions"><button class="button primary" type="submit">Sign in</button></p>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
