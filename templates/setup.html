<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Set up · Recipe Repository</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/display.css">
</head>
<body class="setup-page">
  <main class="app-shell">
    <div class="paper setup-card">
      <div class="form-intro">
        <p class="eyebrow">First access</p>
        <h1>Set up Recipe Repository</h1>
        <p class="deck">Choose a username and a password. This account will protect the recipe library.</p>
      </div>
      <div class="compact-panel">
        <form method="post" action="/setup">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-hint">
          <p class="muted" id="password-hint">At least 8 characters.</p>
          <label for="confirm_password">Confirm password</label>
          <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required aria-describedby="confirm-hint">
          <p class="muted" id="confirm-hint">Both passwords must match.</p>
          {% if !error.is_empty() %}<p class="error" role="alert">{{ error }}</p>{% endif %}
          <p class="actions"><button class="button primary" type="submit">Create account</button></p>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
