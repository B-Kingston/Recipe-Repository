{% extends "base.html" %}{% block title %}Reset password · Kindle Recipes{% endblock %}{% block content %}
<div class="form-intro">
  <p class="eyebrow">Account</p>
  <h1>Reset password</h1>
  <p class="deck">Pick a new password. The library will ask for it on your next sign-in.</p>
</div>
<div class="compact-panel">
  <form method="post" action="/settings/password">
    <label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    <label for="new_password">New password</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password" required>
    {% if !error.is_empty() %}<p class="muted">{{ error }}</p>{% endif %}
    <p class="actions">
      <a class="button" href="/settings">Cancel</a>
      <button class="button primary" type="submit">Reset password</button>
    </p>
  </form>
</div>
{% endblock %}
