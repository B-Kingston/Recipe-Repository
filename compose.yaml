services:
  recipes:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:/data/recipes.sqlite3
    volumes:
      - recipe-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/kindle-recipes", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  recipe-data:
